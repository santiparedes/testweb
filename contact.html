<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css">
    <title>Contact Us - Mi Test Web</title>
</head>

<body>
    <!-- Header Section with Navigation -->
    <header>
        <a href="home.html" class="logo">Mi Test Web</a>
        <nav>
            <a href="home.html">Home</a>
            <a href="about.html">About</a>
            <a href="services.html">Services</a>
            <a href="contact.html" class="active">Contact</a>
            <a href="index.html">Login</a>
            <a href="register.html">Register</a>
        </nav>
    </header>

    <!-- Contact Form Section -->
    <main>
        <div class="container">
            <h1>Contact Us</h1>
            <p>Have questions? We'd love to hear from you.</p>

            <form action="#" method="post">
                <label for="name">Name</label>
                <input id="name" type="text" placeholder="Your Name" required />

                <label for="email">Email</label>
                <input id="email" type="email" placeholder="Your Email" required />

                <label for="message">Message</label>
                <textarea id="message" rows="5" placeholder="Your Message"
                    style="width: 100%; padding: 0.75rem; border: 1px solid #cbd5e1; border-radius: 0.375rem; font-size: 1rem; font-family: inherit;"
                    required></textarea>

                <button type="submit">Send Message</button>
            </form>
        </div>
    </main>

    <!-- Footer Section -->
    <footer>
        &copy; 2026 Mi Test Web. All rights reserved.
    </footer>
</body>

</html>
