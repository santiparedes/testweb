<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Link to the external CSS stylesheet -->
  <link rel="stylesheet" href="style.css">
  <title>Mi Test Web Page</title>
</head>

<body>


  <main class="card" id="loginPage">
    <h1>Login</h1>
    <!-- Login form that submits to home.html via GET request -->
    <form id="loginForm" action="home.html" method="get">
      <label for="username">Username</label>
      <input id="username" type="text" placeholder="Enter username" required />

      <label for="password">Password</label>
      <input id="password" type="password" placeholder="Enter password" required />

      <button type="submit">Sign In</button>
    </form>
    <p style="margin-top: 1rem; text-align: center; font-size: 0.875rem;">
      Don't have an account? <a href="register.html" style="color: #2563eb; text-decoration: none;">Register here</a>
    </p>
  </main>

  <script src="layout.js"></script>
  <script src="script.js"></script>
</body>

</html>
