<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login Demo</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #f0f4ff, #ffffff);
    }

    .card {
      width: min(90vw, 380px);
      background: #fff;
      border-radius: 12px;
      padding: 1.5rem;
      box-shadow: 0 10px 30px rgba(26, 53, 93, 0.12);
    }

    h1 {
      margin-top: 0;
      font-size: 1.5rem;
    }

    label {
      display: block;
      margin-top: 0.8rem;
      font-weight: 600;
      font-size: 0.95rem;
    }

    input {
      width: 100%;
      margin-top: 0.35rem;
      padding: 0.65rem 0.75rem;
      border: 1px solid #cad3e0;
      border-radius: 8px;
      font-size: 1rem;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      margin-top: 1rem;
      padding: 0.7rem;
      border: 0;
      border-radius: 8px;
      background-color: #2563eb;
      color: white;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      background-color: #1d4ed8;
    }

    #homepage {
      display: none;
      text-align: center;
    }

    #homepage p {
      color: #334155;
      line-height: 1.5;
      margin-bottom: 0;
    }

    .hint {
      margin-top: 0.75rem;
      font-size: 0.85rem;
      color: #64748b;
    }
  </style>
</head>
<body>
  <main class="card" id="loginPage">
    <h1>Login</h1>
    <form id="loginForm">
      <label for="username">Username</label>
      <input id="username" type="text" placeholder="Enter username" required />

      <label for="password">Password</label>
      <input id="password" type="password" placeholder="Enter password" required />

      <button type="submit">Sign In</button>
      <p class="hint">Any username/password works for this demo.</p>
    </form>
  </main>

  <main class="card" id="homepage" aria-live="polite">
    <h1>Homepage</h1>
    <p>
      Welcome! Here's something interesting: honey never spoils—archaeologists have found
      pots of honey in ancient Egyptian tombs that were still edible after thousands of years.
    </p>
  </main>

  <script>
    const loginForm = document.getElementById('loginForm');
    const loginPage = document.getElementById('loginPage');
    const homepage = document.getElementById('homepage');

    loginForm.addEventListener('submit', (event) => {
      event.preventDefault();
      loginPage.style.display = 'none';
      homepage.style.display = 'block';
    });
  </script>
</body>
</html>
