<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css">
    <title>Register - Mi Test Web</title>
</head>

<body>
    <!-- Header Section with Navigation -->
    <header>
        <a href="home.html" class="logo">Mi Test Web</a>
        <nav>
            <a href="home.html">Home</a>
            <a href="about.html">About</a>
            <a href="services.html">Services</a>
            <a href="contact.html">Contact</a>
            <a href="index.html">Login</a>
            <a href="register.html" class="active">Register</a>
        </nav>
    </header>

    <!-- Registration Form Section -->
    <main>
        <div class="card">
            <h1>Create Account</h1>
            <form action="index.html" method="get">
                <label for="username">Username</label>
                <input id="username" type="text" placeholder="Choose a username" required />

                <label for="email">Email</label>
                <input id="email" type="email" placeholder="Enter your email" required />

                <label for="password">Password</label>
                <input id="password" type="password" placeholder="Create a password" required />

                <label for="confirm-password">Confirm Password</label>
                <input id="confirm-password" type="password" placeholder="Confirm your password" required />

                <button type="submit">Register</button>
            </form>
            <p style="margin-top: 1rem; text-align: center; font-size: 0.875rem;">
                Already have an account? <a href="index.html" style="color: #2563eb; text-decoration: none;">Login
                    here</a>
            </p>
        </div>
    </main>

    <!-- Footer Section -->
    <footer>
        &copy; 2026 Mi Test Web. All rights reserved.
    </footer>
</body>

</html>
